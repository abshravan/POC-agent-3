version: '3.8'

services:
  # Speaker Identification API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speaker-id-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEVICE=${DEVICE:-cpu}
      - QDRANT_PATH=/app/data/qdrant
      - DATABASE_URL=sqlite+aiosqlite:///./data/sqlite/speakers.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - IDENTIFICATION_THRESHOLD=${IDENTIFICATION_THRESHOLD:-0.55}
      - MIN_ENROLLMENT_SAMPLES=${MIN_ENROLLMENT_SAMPLES:-3}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Qdrant server (for production/distributed setup)
  # Uncomment to use Qdrant server instead of embedded mode
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: speaker-id-qdrant
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - ./data/qdrant-server:/qdrant/storage
  #   environment:
  #     - QDRANT__SERVICE__GRPC_PORT=6334
  #   restart: unless-stopped

  # Optional: Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: speaker-id-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

  # Optional: Prometheus for metrics
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: speaker-id-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
